name: SM-FE-SMCR - Migrate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente su cui applicare le migrazioni
        type: choice
        required: true
        default: app-dev
        options:
          - app-dev
          - app-prod
      confirm:
        description: 'Scrivi "migrate" per confermare'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sm-fe-smcr-migrate-${{ inputs.environment }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  WORKSPACE_NAME: sm-fe-smcr

jobs:
  migrate:
    name: Migrazioni su ${{ inputs.environment }}
    # Il database è privato: usa il runner nella VNet dell'ambiente selezionato.
    runs-on: ${{ inputs.environment == 'app-prod' && 'prod' || 'dev' }}
    environment: ${{ inputs.environment }}-cd

    steps:
      - name: Verifica la conferma
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "migrate" ]; then
            echo "::error::Conferma mancante: scrivi esattamente 'migrate' per procedere."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Applica le migrazioni
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL non configurato nell'environment selezionato."
            exit 1
          fi
          yarn workspace "$WORKSPACE_NAME" db:migrate
