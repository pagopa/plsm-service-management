name: Infra Plan

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Seleziona l'ambiente di deploy"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - dev-base
          - prod
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "infra/resources/prod/**"
      - "infra/resources/dev/**"
      - "infra/resources/dev-base/**"
      - "infra/resources/_modules/**"
      - ".github/workflows/infra_plan.yaml"
      - ".github/workflows/infra_apply.yaml"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Decide quali ambienti pianificare: sul dispatch quello scelto,
  # sulla PR quelli toccati dai file modificati
  changes:
    runs-on: ubuntu-latest
    outputs:
      prod: ${{ steps.filter.outputs.prod }}
      dev: ${{ steps.filter.outputs.dev }}
      dev_base: ${{ steps.filter.outputs.dev_base }}
    steps:
      - name: Checkout
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect environments to plan
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_ENV: ${{ github.event.inputs.target_env }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            [[ "$TARGET_ENV" == "prod" ]] && echo "prod=true" >> $GITHUB_OUTPUT
            [[ "$TARGET_ENV" == "dev" ]] && echo "dev=true" >> $GITHUB_OUTPUT
            [[ "$TARGET_ENV" == "dev-base" ]] && echo "dev_base=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
          echo "Changed files:"
          echo "$CHANGED"

          WORKFLOWS='^\.github/workflows/infra_(plan|apply)\.yaml$'
          MODULES='^infra/resources/_modules/'

          if grep -qE "^infra/resources/prod/|$MODULES|$WORKFLOWS" <<< "$CHANGED"; then
            echo "prod=true" >> $GITHUB_OUTPUT
          fi
          if grep -qE "^infra/resources/dev/|$MODULES|$WORKFLOWS" <<< "$CHANGED"; then
            echo "dev=true" >> $GITHUB_OUTPUT
          fi
          if grep -qE "^infra/resources/dev-base/|$WORKFLOWS" <<< "$CHANGED"; then
            echo "dev_base=true" >> $GITHUB_OUTPUT
          fi

  plan_prod:
    needs: changes
    if: needs.changes.outputs.prod == 'true'
    uses: pagopa/dx/.github/workflows/infra_plan.yaml@main
    name: Plan Infrastructure - prod
    secrets: inherit
    with:
      environment: prod
      base_path: infra/resources
      use_private_agent: true
      use_labels: true
      override_github_environment: infra-prod

  plan_dev:
    needs: changes
    if: needs.changes.outputs.dev == 'true'
    uses: pagopa/dx/.github/workflows/infra_plan.yaml@main
    name: Plan Infrastructure - dev
    secrets: inherit
    with:
      environment: dev
      base_path: infra/resources
      use_private_agent: true
      use_labels: true
      override_github_environment: infra-dev

  plan_dev_base:
    needs: changes
    if: needs.changes.outputs.dev_base == 'true'
    uses: pagopa/dx/.github/workflows/infra_plan.yaml@main
    name: Plan Infrastructure - dev-base
    secrets: inherit
    with:
      environment: dev-base
      base_path: infra/resources
      use_private_agent: true
      use_labels: true
      # dev-base shares the infra-dev GitHub Environment (no dedicated infra-dev-base exists)
      override_github_environment: infra-dev
      # ...and the dev runner: without this the job waits for a "dev-base" runner that doesn't exist
      override_labels: dev
