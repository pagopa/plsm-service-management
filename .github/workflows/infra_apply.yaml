name: Infra Apply

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: "Seleziona l'ambiente di deploy"
        required: true
        default: "prod"
        type: choice
        options:
          - dev
          - dev-base
          - prod
      confirm:
        description: 'Scrivi "apply" per confermare'
        required: true
        type: string
  push:
    branches:
      - main
    # Solo ciò che finisce davvero nel root prod. Gli yaml di environments/ arrivano
    # al Terraform tramite i locals_yaml.tf generati, quindi sono già coperti da prod/**.
    paths:
      - "infra/resources/prod/**"
      - "infra/resources/_modules/**"

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  # Il dispatch parte solo se è stato scritto "apply"
  check_confirm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation
        env:
          CONFIRM: ${{ github.event.inputs.confirm }}
        run: |
          if [[ "$CONFIRM" != "apply" ]]; then
            echo "❌ Scrivi \"apply\" nel campo di conferma per procedere"
            exit 1
          fi

  # Prod si applica solo da main o da infra/*; dev e dev-base da qualunque branch
  # (sono il banco di prova). L'environment infra-prod-cd ha comunque branch policy
  # e required reviewers.
  check_branch:
    if: github.event_name == 'push' || github.event.inputs.target_env == 'prod'
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check branch name
        id: check
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          echo "Current branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == "main" ]] || [[ "$BRANCH_NAME" == infra/* ]]; then
            echo "✅ Branch allowed to apply infrastructure"
            echo "allowed=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Branch NOT allowed to apply infrastructure"
            echo "⚠️  Only 'main' or 'infra/*' branches can apply prod"
            echo "allowed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

  apply_prod:
    needs: [check_confirm, check_branch]
    # always() serve perché check_confirm è skipped sui push
    if: >-
      always() &&
      needs.check_branch.outputs.allowed == 'true' &&
      (github.event_name == 'push' || needs.check_confirm.result == 'success')
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@main
    name: Apply Infrastructure - prod
    secrets: inherit
    with:
      environment: prod
      base_path: infra/resources
      use_private_agent: true
      use_labels: true
      override_github_environment: infra-prod

  apply_dev:
    needs: check_confirm
    if: github.event.inputs.target_env == 'dev'
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@main
    name: Apply Infrastructure - dev
    secrets: inherit
    with:
      environment: dev
      base_path: infra/resources
      use_private_agent: true
      use_labels: true
      override_github_environment: infra-dev

  apply_dev_base:
    needs: check_confirm
    if: github.event.inputs.target_env == 'dev-base'
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@main
    name: Apply Infrastructure - dev-base
    secrets: inherit
    with:
      environment: dev-base
      base_path: infra/resources
      use_private_agent: true
      use_labels: true
      # dev-base shares the infra-dev GitHub Environment (no dedicated infra-dev-base exists)
      override_github_environment: infra-dev
      # ...and the dev runner: without this the job waits for a "dev-base" runner that doesn't exist
      override_labels: dev
